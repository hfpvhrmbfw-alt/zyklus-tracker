# Xcode-Projekt für die iOS-App. Erzeugen mit: xcodegen   (danach Zyklus.xcodeproj öffnen)
# Die .xcodeproj-Datei wird nicht eingecheckt, sie entsteht immer neu aus dieser Datei.
name: Zyklus
options:
  bundleIdPrefix: de.annagramm
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
packages:
  ZyklusKit:
    path: ZyklusKit
targets:
  Zyklus:
    type: application
    platform: iOS
    sources:
      - path: Zyklus
    dependencies:
      - package: ZyklusKit
    info:
      path: Zyklus/Info.plist
      properties:
        CFBundleDisplayName: Zyklus
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        # Ordner „Auf meinem iPhone › Zyklus“ in der Dateien-App, dort liegen die automatischen Sicherungen
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIAppFonts:
          - DMSerifDisplay-Regular.ttf
          - Outfit-Regular.ttf
          - Outfit-Medium.ttf
          - Outfit-SemiBold.ttf
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.annagramm.zyklus
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # Hier deine Team-ID eintragen, sobald der Developer Account da ist (oder in Xcode unter Signing auswählen)
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
schemes:
  Zyklus:
    build:
      targets:
        Zyklus: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ZyklusKit/ZyklusKitTests
